<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/plataformas_style.css">
    <title>Plataformas</title>
</head>
<body>
    <header>
        <div class="header__img">
            <img src="../assets/logo_sinfondo.png" alt="">
        </div>
        <nav class="header__nav">
            <a href="">Inicio</a>
            <a href="">Acerca de</a>
            <a href="">Contacto</a>
            <a href="" class="header__button">Iniciar Sesión</a>
        </nav>
    </header>

    <main>
        <section class="plataformas">

            <div class="pasos">

                <p><strong>Paso 1 de 4:</strong> Seleccion de plataforma</p>

                <div class="pasos__grafico">
                    <div class="pasos__progreso"></div>
                    <div class="paso__circle">
                        <div class="circle_full"></div>
                    </div>
                    
                    <div class="paso__circle">
                        <div class="circle"></div>
                    </div>

                    <div class="paso__circle">
                        <div class="circle"></div>
                    </div>

                    <div class="paso__circle">
                        <div class="circle"></div>
                    </div>

                    
                </div>

            </div>
            <h2>¿Que plataformas necesitas?</h2>
            <form action="#" class="plataforma__form">

                <div class="plataforma_checkbox">
                    <img src="../assets/check.png" alt="" class="check">
                    <img src="../assets/ios_logo.png" alt="" class="checkbox__img">
                    <h3>iOS</h3>
                    <p>Aplicaciones para iPhone y iPad</p>
                </div>

                <div class="plataforma_checkbox">
                    <img src="../assets/check.png" alt="" class="check">
                    <img src="../assets/icons8-android-os-500.png" alt="" class="checkbox__img">
                    <h3>Android</h3>
                    <p>Aplicaciones para dispositivos Android</p>
                </div>
                <div class="plataforma_checkbox">
                    <img src="../assets/check.png" alt="" class="check">
                    <img src="../assets/sitio-web.png" alt="" class="checkbox__img">
                    <h3>Web</h3>
                    <p>Aplicaciones y sitios web accesibles</p>
                </div>
                <a href="index.html" class="form__button_cancel">Anterior</a>
                <a href="" class="form__button_next">Siguiente</a>
            </form>
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>
